<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" role="img" aria-label="句子切成 token 積木">
<title>句子切成 token 積木</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6b8a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6336c"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker></defs>
<rect width="1000" height="430" rx="18" fill="#fbfcff"/>
<text x="500.0" y="46" font-size="30" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">床前明月光，疑是地上霜。</text><line x1="500.0" y1="64" x2="500.0" y2="98" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="30" y="108" width="450" height="290" rx="14" fill="#f4f8ff" stroke="#c9d3e6" stroke-width="2"/><text x="255" y="142" font-size="18" font-weight="700" fill="#2563c9" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">唐詩小模型：一個字一塊</text><rect x="52" y="168" width="46" height="40" rx="9" fill="#ffd8a8" stroke="none" stroke-width="2"/><text x="75.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">床</text><text x="75" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">1</text><rect x="104" y="168" width="46" height="40" rx="9" fill="#c3e6ff" stroke="none" stroke-width="2"/><text x="127.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">前</text><text x="127" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">2</text><rect x="156" y="168" width="46" height="40" rx="9" fill="#d3f9d8" stroke="none" stroke-width="2"/><text x="179.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">明</text><text x="179" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">3</text><rect x="208" y="168" width="46" height="40" rx="9" fill="#e5dbff" stroke="none" stroke-width="2"/><text x="231.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">月</text><text x="231" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">4</text><rect x="260" y="168" width="46" height="40" rx="9" fill="#ffc9c9" stroke="none" stroke-width="2"/><text x="283.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">光</text><text x="283" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">5</text><rect x="312" y="168" width="46" height="40" rx="9" fill="#fff3bf" stroke="none" stroke-width="2"/><text x="335.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">，</text><text x="335" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">6</text><rect x="364" y="168" width="46" height="40" rx="9" fill="#c5f6fa" stroke="none" stroke-width="2"/><text x="387.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">疑</text><text x="387" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">7</text><rect x="416" y="168" width="46" height="40" rx="9" fill="#ffdeeb" stroke="none" stroke-width="2"/><text x="439.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">是</text><text x="439" y="232" font-size="13" font-weight="600" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">8</text><text x="255" y="268" font-size="15" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">字典＝唐詩裡出現過的所有字（6,746 個）</text><text x="255" y="296" font-size="15" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">「接下一個字」就是在這 6,746 個字裡挑一個</text><rect x="520" y="108" width="450" height="290" rx="14" fill="#fffaf0" stroke="#c9d3e6" stroke-width="2"/><text x="745" y="142" font-size="18" font-weight="700" fill="#e39a17" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">大模型：常見的詞合成一塊</text><rect x="545" y="168" width="62" height="40" rx="9" fill="#e5dbff" stroke="none" stroke-width="2"/><text x="576.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">人工</text><rect x="615" y="168" width="62" height="40" rx="9" fill="#ffc9c9" stroke="none" stroke-width="2"/><text x="646.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">智慧</text><rect x="685" y="168" width="40" height="40" rx="9" fill="#fff3bf" stroke="none" stroke-width="2"/><text x="705.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">很</text><rect x="733" y="168" width="62" height="40" rx="9" fill="#c5f6fa" stroke="none" stroke-width="2"/><text x="764.0" y="195.2" font-size="20" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">厲害</text><rect x="545" y="228" width="62" height="40" rx="9" fill="#fff3bf" stroke="none" stroke-width="2"/><text x="576.0" y="254.48" font-size="18" font-weight="700" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">un</text><rect x="615" y="228" width="150" height="40" rx="9" fill="#c5f6fa" stroke="none" stroke-width="2"/><text x="690.0" y="254.48" font-size="18" font-weight="700" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">believ</text><rect x="773" y="228" width="106" height="40" rx="9" fill="#ffdeeb" stroke="none" stroke-width="2"/><text x="826.0" y="254.48" font-size="18" font-weight="700" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">able</text><text x="745" y="300" font-size="15" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">字典有十幾萬到二十幾萬塊積木</text><text x="745" y="326" font-size="15" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">少見的字、英文單字常被拆成好幾塊</text><text x="745" y="352" font-size="15" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">AI 收費、能讀多長，都用 token 數計算</text><text x="980" y="416" font-size="12" font-weight="400" fill="#9aa6bf" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">示意圖：大模型實際怎麼切，依各模型的字典而定</text></svg>