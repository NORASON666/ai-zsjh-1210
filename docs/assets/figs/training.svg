<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" role="img" aria-label="訓練：猜、對答案、修正">
<title>訓練：猜、對答案、修正</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6b8a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6336c"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker></defs>
<rect width="1000" height="440" rx="18" fill="#fbfcff"/>
<text x="500.0" y="40" font-size="20" font-weight="700" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">訓練：猜 → 對答案 → 修正，重複幾千次</text><rect x="40" y="150" width="44" height="44" rx="9" fill="#ffd8a8" stroke="none" stroke-width="2"/><text x="62.0" y="179.56" font-size="21" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">床</text><rect x="88" y="150" width="44" height="44" rx="9" fill="#c3e6ff" stroke="none" stroke-width="2"/><text x="110.0" y="179.56" font-size="21" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">前</text><rect x="136" y="150" width="44" height="44" rx="9" fill="#d3f9d8" stroke="none" stroke-width="2"/><text x="158.0" y="179.56" font-size="21" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">明</text><rect x="184" y="150" width="44" height="44" rx="9" fill="#e5dbff" stroke="none" stroke-width="2"/><text x="206.0" y="179.56" font-size="21" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">月</text><text x="136" y="136" font-size="14" font-weight="700" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">教材：前面的字</text><line x1="240" y1="172" x2="300" y2="172" stroke="#2563c9" stroke-width="2.5" marker-end="url(#arb)"/><rect x="308" y="120" width="210" height="104" rx="14" fill="#eef6ff" stroke="#2563c9" stroke-width="2"/><text x="413" y="162" font-size="18" font-weight="700" fill="#2563c9" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">🧠 模型</text><text x="413" y="190" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">1,327 萬個參數</text><line x1="524" y1="172" x2="584" y2="172" stroke="#2563c9" stroke-width="2.5" marker-end="url(#arb)"/><text x="414" y="108" font-size="15" font-weight="800" fill="#2563c9" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">① 正向：猜</text><rect x="592" y="96" width="180" height="160" rx="14" fill="#fff" stroke="#c9d3e6" stroke-width="2"/><text x="682" y="122" font-size="14" font-weight="700" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">模型猜的</text><text x="612" y="158" font-size="19" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">月</text><rect x="632" y="145" width="96" height="16" rx="4" fill="#f2c879"/><text x="736.0" y="158" font-size="12" font-weight="700" fill="#5c6b8a" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">30%</text><text x="612" y="194" font-size="19" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">光</text><rect x="632" y="181" width="16" height="16" rx="4" fill="#2b8a3e"/><text x="656.0" y="194" font-size="12" font-weight="700" fill="#5c6b8a" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">5%</text><text x="612" y="230" font-size="19" font-weight="900" fill="#13203a" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">下</text><rect x="632" y="217" width="13" height="16" rx="4" fill="#f2c879"/><text x="652.8" y="230" font-size="12" font-weight="700" fill="#5c6b8a" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">4%</text><line x1="776" y1="172" x2="826" y2="172" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="834" y="120" width="130" height="104" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="899" y="156" font-size="14" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">正確答案</text><text x="899" y="196" font-size="30" font-weight="900" fill="#2b8a3e" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif">光</text><rect x="560" y="300" width="300" height="66" rx="14" fill="#ffe8f0" stroke="#d6336c" stroke-width="2"/><text x="710" y="330" font-size="16" font-weight="800" fill="#d6336c" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">② 比一比：誤差有多大</text><text x="710" y="354" font-size="13" font-weight="400" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">「光」只給 5%，誤差很大</text><path d="M899,226 C899,280 880,320 864,330" fill="none" stroke="#d6336c" stroke-width="2" marker-end="url(#arr)"/><path d="M556,333 C470,333 413,300 413,230" fill="none" stroke="#d6336c" stroke-width="3" marker-end="url(#arr)"/><text x="370" y="300" font-size="15" font-weight="800" fill="#d6336c" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">③ 反向：修正參數</text><text x="370" y="322" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">讓下次「光」的機率高一點</text><text x="500.0" y="414" font-size="15" font-weight="700" fill="#2563c9" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">唐詩小模型每秒讀約 15 萬字，1,500 步後猜中率從 0% 升到約 30%</text></svg>