<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" role="img" aria-label="兩個 AI 互相檢查">
<title>兩個 AI 互相檢查</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6b8a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6336c"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker></defs>
<rect width="1000" height="380" rx="18" fill="#fbfcff"/>
<text x="500.0" y="40" font-size="20" font-weight="700" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">兩個不同的 AI：一個出題，一個審題</text><rect x="40" y="120" width="200" height="110" rx="14" fill="#eef6ff" stroke="#2563c9" stroke-width="2"/><text x="140" y="160" font-size="17" font-weight="700" fill="#2563c9" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">✍️ 出題 AI</text><text x="140" y="186" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">Gemma 4（GX10-A）</text><text x="140" y="208" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">出 5 道類似題＋答案</text><line x1="246" y1="175" x2="300" y2="175" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="308" y="130" width="170" height="90" rx="14" fill="#fff" stroke="#c9d3e6" stroke-width="2"/><text x="393" y="166" font-size="15" font-weight="700" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">第 3 題的題目</text><text x="393" y="194" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">（答案先藏起來）</text><line x1="484" y1="175" x2="538" y2="175" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="546" y="120" width="200" height="110" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="646" y="160" font-size="17" font-weight="700" fill="#7048e8" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">🔍 審題 AI</text><text x="646" y="186" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">gpt-oss（GX10-B）</text><text x="646" y="208" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">看不到答案，自己作答</text><line x1="752" y1="160" x2="806" y2="110" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><line x1="752" y1="190" x2="806" y2="250" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><text x="780" y="62" font-size="13" font-weight="700" fill="#2563c9" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">和出題答案 B 比一比</text><rect x="814" y="76" width="160" height="70" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="894" y="106" font-size="16" font-weight="800" fill="#2b8a3e" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">也選 B ✔</text><text x="894" y="130" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">保留</text><rect x="814" y="216" width="160" height="70" rx="14" fill="#fff5f5" stroke="#d6336c" stroke-width="2"/><text x="894" y="246" font-size="16" font-weight="800" fill="#d6336c" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">選了 C ✘</text><text x="894" y="270" font-size="13" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">退回</text><text x="500.0" y="336" font-size="15" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">同一個 AI 很難發現自己的錯；兩個都同意的題目，最後仍請老師確認</text></svg>