<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" role="img" aria-label="卷積神經網路找影像線索">
<title>卷積神經網路找影像線索</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6b8a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6336c"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="#fbfcff"/>
<text x="500.0" y="40" font-size="20" font-weight="700" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">影像辨識（CNN）：小濾鏡一層一層找線索</text><rect x="40" y="90" width="190" height="190" rx="12" fill="#fff0f6" stroke="#c9d3e6" stroke-width="2"/><text x="135" y="222" font-size="110" font-weight="400" fill="#13203a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">🌹</text><rect x="64" y="110" width="54" height="54" fill="none" stroke="#e39a17" stroke-width="3" rx="4"/><text x="91" y="104" font-size="12" font-weight="700" fill="#e39a17" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">3×3 濾鏡</text><line x1="236" y1="185" x2="292" y2="185" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="300" y="110" width="100" height="100" rx="8" fill="hsl(200,55%,86%)" stroke="#fff" stroke-width="2"/><rect x="312" y="122" width="100" height="100" rx="8" fill="hsl(200,55%,78%)" stroke="#fff" stroke-width="2"/><rect x="324" y="134" width="100" height="100" rx="8" fill="hsl(200,55%,70%)" stroke="#fff" stroke-width="2"/><rect x="336" y="146" width="100" height="100" rx="8" fill="hsl(200,55%,62%)" stroke="#fff" stroke-width="2"/><text x="360" y="270" font-size="14" font-weight="700" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">邊緣、顏色</text><line x1="440" y1="185" x2="462" y2="185" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="470" y="110" width="100" height="100" rx="8" fill="hsl(240,55%,86%)" stroke="#fff" stroke-width="2"/><rect x="482" y="122" width="100" height="100" rx="8" fill="hsl(240,55%,78%)" stroke="#fff" stroke-width="2"/><rect x="494" y="134" width="100" height="100" rx="8" fill="hsl(240,55%,70%)" stroke="#fff" stroke-width="2"/><text x="530" y="270" font-size="14" font-weight="700" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">紋理、形狀</text><line x1="610" y1="185" x2="632" y2="185" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="640" y="110" width="100" height="100" rx="8" fill="hsl(280,55%,86%)" stroke="#fff" stroke-width="2"/><rect x="652" y="122" width="100" height="100" rx="8" fill="hsl(280,55%,78%)" stroke="#fff" stroke-width="2"/><text x="700" y="270" font-size="14" font-weight="700" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">花瓣、葉子</text><line x1="780" y1="185" x2="802" y2="185" stroke="#5c6b8a" stroke-width="2.5" marker-end="url(#ar)"/><text x="470" y="300" font-size="14" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">越後面的層，看的範圍越大</text><text x="870" y="148" font-size="15" font-weight="700" fill="#13203a" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">玫瑰</text><rect x="878" y="134" width="77" height="18" rx="4" fill="#e39a17"/><text x="961.4" y="148" font-size="12" font-weight="700" fill="#5c6b8a" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">86%</text><text x="870" y="186" font-size="15" font-weight="700" fill="#13203a" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">鬱金香</text><rect x="878" y="172" width="9" height="18" rx="4" fill="#f2c879"/><text x="893.0" y="186" font-size="12" font-weight="700" fill="#5c6b8a" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">10%</text><text x="870" y="224" font-size="15" font-weight="700" fill="#13203a" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">向日葵</text><rect x="878" y="210" width="4" height="18" rx="4" fill="#f2c879"/><text x="887.6" y="224" font-size="12" font-weight="700" fill="#5c6b8a" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">4%</text><text x="500.0" y="360" font-size="14" font-weight="400" fill="#5c6b8a" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">訓練時留 20% 照片不給它看，最後拿來考試；遷移學習是借用看過 120 萬張照片的模型</text><text x="980" y="386" font-size="12" font-weight="400" fill="#9aa6bf" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">示意圖：機率為範例</text></svg>