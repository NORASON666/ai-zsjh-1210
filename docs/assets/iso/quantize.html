ade" data-shade="0" d="M528 265L527.8 265.4L527.8 154.3L528 153.9ZM527.8 265.4L517 274.1L517 163L527.8 154.3ZM517 274.1L516.3 274.3L516.3 163.2L517 163Z"/><path class="iso-shade" data-shade="2" d="M516.3 274.3L515.5 274.3L515.5 163.2L516.3 163.2Z"/><path class="iso-shade" data-shade="3" d="M515.5 274.3L512.6 273.4L512.6 162.3L515.5 163.2ZM512.6 273.4L512.1 273L512.1 161.9L512.6 162.3Z"/><path class="iso-top" d="M527.5 153.6L528 153.9L527.8 154.3L517 163L516.3 163.2L515.5 163.2L512.6 162.3L512.1 161.9L512.2 161.5L523 152.8L523.7 152.6L524.6 152.7Z"/><path class="iso-line iso-edge" data-tone="mid" d="M512.1 161.9L512.2 161.5L523 152.8L523.7 152.6L524.6 152.7L527.5 153.6L528 153.9M528 265L527.8 265.4L517 274.1L516.3 274.3L515.5 274.3L512.6 273.4L512.1 273M528 153.9L528 265M512.1 161.9L512.1 273"/></g><path class="iso-line" data-tone="lo" d="M528.4 255.2L524 258.7M528.4 248.6L524 252.1M528.4 242.1L524 245.6M528.4 229L524 232.5M528.4 222.5L524 226M528.4 215.9L524 219.5M528.4 202.9L524 206.4M528.4 196.3L524 199.9M528.4 189.8L524 193.3M528.4 176.7L524 180.3M528.4 170.2L524 173.7M528.4 163.7L524 167.2"/><path class="iso-line" data-tone="mid" d="M528 235.6L527.8 236L517 244.7L516.3 244.9L515.5 244.9L512.6 244L512.1 243.6M528 209.5L527.8 209.9L517 218.5L516.3 218.8L515.5 218.7L512.6 217.8L512.1 217.5M528 183.3L527.8 183.7L517 192.4L516.3 192.6L515.5 192.6L512.6 191.7L512.1 191.3M528 157.2L527.8 157.6L517 166.2L516.3 166.5L515.5 166.4L512.6 165.5L512.1 165.2"/></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>後面的滑塊：參數原本的數</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>前面的滑塊：實際記下來的數，只能停在刻度上</span></span><span class="iso-caption">每個參數都是一個小數。位元越少，尺上的刻度越疏，記下來的數會和原本的差一點點，但板子（記憶體）少很多。柱子頂端是一台 GX10 的 128 GB；一塊板子 13 GB。</span></figcaption></figure><div class="zs-panel"><div class="zs-chips" data-chips></div><div class="zq-facts"><div><b data-fact="levels"></b>0 到 1 之間的刻度</div><div><b data-fact="error"></b>這個數記下來差了多少</div><div><b data-fact="gb"></b>Gemma 4 的 260 億個參數佔多少</div></div><p class="zs-note">學校的 GX10-A 跑的是 4 位元版的 Gemma 4（NVIDIA 的 NVFP4 格式）。示意：真正的 NVFP4 是每一小組參數共用一個縮放比例的浮點格式，比這裡的平均刻度更聰明，誤差也更小。16 位元的刻度有 3 萬多格，畫不出來，圖上只畫得很密來表示。</p><div class="zs-live" aria-live="polite" data-live></div></div></main><script type="module">
const FLAGS = new URLSearchParams(location.search);
for (const flag of ["embed", "slim", "deck"]) if (FLAGS.has(flag)) document.documentElement.dataset[flag] = "";
if (FLAGS.has("embed") && parent !== window) new ResizeObserver(([entry]) => {
  const height = Math.ceil(entry.target.getBoundingClientRect().bottom) + 2;
  if (height > 100) parent.postMessage({ zsIso: location.pathname.split("/").pop(), height }, "*"); // 還沒顯示時高度是 0，不回報
}).observe(document.querySelector(".iso-page"));
if (FLAGS.has("deck") && parent !== window) addEventListener("keydown", (event) => {
  event.stopImmediatePropagation();
  event.preventDefault();
  parent.postMessage({ zsKey: { key: event.key, code: event.code } }, "*");
}, true);
const DATA = {"BITS":[16,8,4],"PARAMS":26000000000,"GB_PER_PLATE":13,"X0":-124,"SPAN":148,"AX":[1.600065098717323,0.49991582062412476]};
// 互動：移動參數原本的數，前面的滑塊跳到最近的刻度；換位元數，刻度、儲存格、記憶體板子一起變。
// 刻度數與記憶體的算法和原理教室 inside.html 的 ⑪ 量化相同。
const { BITS, PARAMS, GB_PER_PLATE, X0, SPAN, AX } = DATA;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const chips = document.querySelector("[data-chips]");
const fact = (name) => document.querySelector(`[data-fact="${name}"]`);
const liveRegion = document.querySelector("[data-live]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const original = svg.querySelector('[data-part="original"]');
const stored = svg.querySelector('[data-part="stored"]');
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const levelsOf = (bits) => 2 ** (bits - 1) - 1;
const snap = (value, bits) => Math.round(value * levelsOf(bits)) / levelsOf(bits);
const gbOf = (bits) => (PARAMS * bits) / 8 / 1e9;
const HOLD = 7; // 使用者操作後，暫停自動示範的秒數

let bits = 4;
let value = 0.7853, target = value; // 參數原本的數（0～1），和原理教室用同一個起始值
let shown = snap(value, bits); // 前面滑塊目前畫在哪裡（追著刻度走）
let frame = 0, last = 0, visible = false, clock = 0, hold = 0, touring = !still.matches;

const place = (group, v) => group.setAttribute("transform", `translate(${((X0 + v * SPAN) * AX[0]).toFixed(2)} ${((X0 + v * SPAN) * AX[1]).toFixed(2)})`);

function showBits() {
  svg.querySelectorAll("[data-ticks]").forEach((group) => (group.style.display = +group.dataset.ticks === bits ? "" : "none"));
  svg.querySelectorAll("[data-cell]").forEach((cell) => {
    const up = +cell.dataset.cell < bits;
    cell.querySelector("[data-up]").style.display = up ? "" : "none";
    cell.querySelector("[data-down]").style.display = up ? "none" : "";
  });
  svg.querySelectorAll("[data-plate]").forEach((plate) => plate.toggleAttribute("data-off", (+plate.dataset.plate + 1) * GB_PER_PLATE > gbOf(bits)));
  [...chips.children].forEach((button) => button.setAttribute("aria-pressed", String(+button.dataset.bits === bits)));
  fact("levels").textContent = `${levelsOf(bits).toLocaleString()} 格`;
  fact("gb").textContent = `約 ${gbOf(bits).toFixed(0)} GB`;
  liveRegion.textContent = `${bits} 位元：${levelsOf(bits).toLocaleString()} 格刻度，260 億個參數約 ${gbOf(bits).toFixed(0)} GB`;
}

function draw() {
  const kept = snap(value, bits);
  place(original, value);
  place(stored, shown);
  const digits = bits === 16 ? 5 : 4;
  const text = `${bits} 位元 · ${value.toFixed(4)} 記成 ${kept.toFixed(digits)} · 約 ${gbOf(bits).toFixed(0)} GB`;
  if (readout.textContent !== text) readout.textContent = text;
  const error = `差 ${Math.abs(kept - value).toFixed(bits === 16 ? 6 : 4)}`;
  if (fact("error").textContent !== error) fact("error").textContent = error;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  hold = Math.max(0, hold - dt);
  if (!hold && !calm) touring = true;
  if (touring) {
    clock += dt;
    target = 0.5 + 0.44 * Math.sin(clock * 0.5 + 0.7);
    const turn = BITS[BITS.length - 1 - (Math.floor(clock / 8) % BITS.length)]; // 4 → 8 → 16，每 8 秒換一次
    if (turn !== bits) { bits = turn; showBits(); }
  }
  value = calm ? target : value + (target - value) * (1 - Math.exp(-dt / 0.22));
  if (Math.abs(target - value) < 1e-4) value = target;
  const want = snap(value, bits);
  shown = calm ? want : shown + (want - shown) * (1 - Math.exp(-dt / 0.07)); // 快速「卡」進刻度
  if (Math.abs(want - shown) < 1e-4) shown = want;
  draw();
  const settled = !touring && value === target && shown === want && !hold;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const touch = () => { touring = false; hold = HOLD; };
const setBits = (next) => { bits = next; showBits(); run(); };

BITS.forEach((b) => {
  const button = document.createElement("button");
  button.type = "button";
  button.dataset.bits = b;
  button.textContent = b === 4 ? "4 位元（GX10-A 用的）" : `${b} 位元`;
  button.addEventListener("click", () => { touch(); setBits(b); });
  chips.append(button);
});
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  touch();
  target = clamp(((event.clientX - box.left) / box.width - 0.12) / 0.52, 0, 1);
  run();
});
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 0.1 : 0.01;
  const at = BITS.indexOf(bits);
  const moves = {
    ArrowRight: () => (target = clamp(target + step, 0, 1)), ArrowLeft: () => (target = clamp(target - step, 0, 1)),
    Home: () => (target = 0), End: () => (target = 1),
    ArrowDown: () => setBits(BITS[Math.min(BITS.length - 1, at + 1)]), ArrowUp: () => setBits(BITS[Math.max(0, at - 1)]),
  };
  if (!moves[event.key]) return;
  event.preventDefault();
  if (touring) target = value; // 接手自動示範時，從現在看到的位置起算
  touch();
  moves[event.key]();
  run();
});
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

showBits();
draw();
</script></body></html>
