const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const part = (name) => svg.querySelector(`[data-part="${name}"]`);
const readout = document.querySelector("[data-readout]");
const fact = (name) => document.querySelector(`[data-fact="${name}"]`);
const liveRegion = document.querySelector("[data-live]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const cart = part("cart"), reader = part("reader"), fly = part("fly"), flyChar = part("fly-char");
const HOLD = 8; // 使用者操作後，暫停自動示範的秒數
const HOVER = 9; // 活字被提起來移動時離檯面的高度
const ease = (t) => t * t * (3 - 2 * t);
const shift = (x, y, z) => `translate(${(x * AX[0] + y * AY[0] + z * AZ[0]).toFixed(2)} ${(x * AX[1] + y * AY[1] + z * AZ[1]).toFixed(2)})`;

let count = 0; // 已經接上去的字數
let reads = 0; // 前面的字累計被讀了幾次
let now = { rx: SLOT_X[GIVEN.length - 1], cx: 0, fx: 0, fy: 0, fz: 0, fo: 0 }; // 指針、台車、飛行中的活字
let steps = null, stepAt = 0, stepFrom = null, phase = "";
let frame = 0, last = 0, visible = false, hold = 0, rest = 0, auto = !still.matches;

function lit(name) {
  svg.querySelectorAll('[data-st="reader"] .iso-solid').forEach((solid) => solid.toggleAttribute("data-lit", name === "reader"));
}

function draw() {
  reader.setAttribute("transform", shift(now.rx, 0, 0));
  cart.setAttribute("transform", shift(now.cx, 0, 0));
  fly.setAttribute("transform", shift(now.fx, now.fy, now.fz));
  fly.setAttribute("opacity", now.fo.toFixed(2));
}

function show() {
  svg.querySelectorAll("[data-slot]").forEach((slot) => (slot.style.display = +slot.dataset.slot < GIVEN.length + count ? "" : "none"));
  const line = GIVEN.join("") + TOKENS.slice(0, count).join("");
  fact("line").textContent = line;
  fact("runs").textContent = `${count} 次`;
  fact("reads").textContent = `${reads} 次`;
}

function say() {
  const length = GIVEN.length + count;
  let text;
  if (phase === "read") text = `第 ${count + 1} 次 · 先讀前面 ${length} 個字`;
  else if (phase === "pick") text = `第 ${count + 1} 次 · 挑出「${TOKENS[count]}」接到句尾`;
  else if (count === TOKENS.length) text = `接了 ${count} 個字 · 模型跑了 ${count} 次`;
  else text = `句子 ${length} 個字 · 模型跑了 ${count} 次`;
  if (readout.textContent !== text) readout.textContent = text;
}

// 接第 count 個字的動作表：每一步是「花幾秒，把哪些量帶到哪裡」
function planNext() {
  const length = GIVEN.length + count;
  const from = RACK_X[count], to = SLOT_X[length];
  flyChar.textContent = TOKENS[count];
  return [
    { phase: "read", time: 0.3, to: { rx: SLOT_X[0] } },
    { phase: "read", time: 0.35 + 0.14 * length, to: { rx: SLOT_X[length - 1] } },
    { phase: "pick", time: 0.45, to: { cx: from }, set: { fx: from, fy: RACK_Y, fz: RACK_Z, fo: 0 } },
    { phase: "pick", time: 0.3, to: { fz: RACK_Z + HOVER, fo: 1 } },
    { phase: "pick", time: 0.4, to: { fy: CART_Y } },
    { phase: "pick", time: 0.25, to: { fz: CART_Z } },
    { phase: "pick", time: 0.3 + Math.abs(to - from) / 160, to: { cx: to, fx: to } },
    { phase: "pick", time: 0.25, to: { fz: CART_Z + HOVER } },
    { phase: "pick", time: 0.45, to: { fy: LINE_Y } },
    { phase: "pick", time: 0.3, to: { fz: LINE_Z } },
    { phase: "place", time: 0.01, to: {} },
  ];
}

function begin(step) {
  stepFrom = { ...now, ...(step.set || {}) };
  Object.assign(now, step.set || {});
  if (step.phase !== phase) {
    phase = step.phase;
    lit(phase === "read" ? "reader" : "fly");
    if (phase === "read") { reads += GIVEN.length + count; fact("reads").textContent = `${reads} 次`; }
    if (phase === "place") { count += 1; now.fo = 0; show(); liveRegion.textContent = `接上「${TOKENS[count - 1]}」，句子現在是 ${fact("line").textContent}`; phase = ""; lit(""); }
    say();
  }
}

function next() {
  if (steps || count >= TOKENS.length) return;
  steps = planNext();
  stepAt = 0;
  begin(steps[0]);
  if (still.matches) { while (steps.length > 1) { Object.assign(now, steps[0].to); steps.shift(); begin(steps[0]); } steps = null; draw(); }
  run();
}

function reset(to = 0) {
  steps = null; phase = ""; lit("");
  count = to;
  reads = 0;
  for (let i = 0; i < count; i++) reads += GIVEN.length + i;
  now.fo = 0;
  now.rx = SLOT_X[GIVEN.length + count - 1];
  show(); say(); draw();
}

function tick(time) {
  const dt = last ? Math.min((time - last) / 1000, 1 / 30) : 1 / 60;
  last = time;
  if (steps) {
    stepAt += dt;
    const step = steps[0];
    const t = Math.min(1, stepAt / step.time);
    for (const key in step.to) now[key] = stepFrom[key] + (step.to[key] - stepFrom[key]) * ease(t);
    if (t >= 1) { steps.shift(); stepAt = 0; if (steps.length) begin(steps[0]); else { steps = null; rest = 0; } }
    draw();
  } else {
    hold = Math.max(0, hold - dt);
    if (!hold && !still.matches) auto = true;
    if (auto) {
      rest += dt;
      if (count >= TOKENS.length) { if (rest > 3.2) { reset(); rest = 0; } }
      else if (rest > 0.7) next();
    }
  }
  frame = visible && (steps || !still.matches) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const touch = () => { auto = false; hold = HOLD; };
const acts = {
  next: () => { if (count >= TOKENS.length) reset(); else next(); },
  back: () => { if (!steps) reset(Math.max(0, count - 1)); },
  reset: () => reset(),
};
const act = (name) => { touch(); acts[name](); run(); };

document.querySelectorAll("[data-act]").forEach((button) => button.addEventListener("click", () => act(button.dataset.act)));
stage.addEventListener("click", () => act("next"));
stage.addEventListener("keydown", (event) => {
  const name = { ArrowRight: "next", " ": "next", Enter: "next", ArrowLeft: "back", Home: "reset" }[event.key];
  if (!name) return;
  event.preventDefault();
  act(name);
});
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

reset();
</script></body></html>
